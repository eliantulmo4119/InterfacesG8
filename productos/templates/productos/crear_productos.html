{% load static %}

{% include "private/header.html" %}

<div class="container mt-4">
    <h2>Crear Producto</h2>
    <br>

    <form method="post">
        {% csrf_token %}

        <!-- Nombre -->
        <div class="mb-3">
            <label>Nombre Producto</label>
            <input type="text" name="nombreProducto" class="form-control" required>
        </div>

        <!-- Precio (TE FALTABA ESTE CAMPO) -->
        <div class="mb-3">
            <label>Precio Producto</label>
            <input type="number" step="0.01" name="precioProducto" class="form-control" required>
        </div>

        <!-- Stock -->
        <div class="mb-3">
            <label>Stock Producto</label>
            <input type="number" name="stockProducto" class="form-control" required>
        </div>

        <!-- Estado -->
        <div class="mb-3">
            <label>Estado Producto</label>
            <select name="estadoProducto" class="form-control" required>
                <option value="">Seleccione</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>
        </div>

        <!-- Botones -->
        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a href="{% url 'listar_productos' %}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>
</div>

{% include "private/footer.html" %}
