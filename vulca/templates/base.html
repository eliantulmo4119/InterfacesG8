{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/png" href="{% static 'imagenes/hola2.png' %}">

    <title>{% block title %}Vulcanizadora Elian - Sistema de Inventario{% endblock %}</title>           
    
    <link rel="stylesheet" href="{% static 'public/assets/bootstrap/css/bootstrap.min.css' %}">        
    <link rel="stylesheet" href="{% static 'public/assets/css/fonts.css' %}">         
    <link rel="stylesheet" href="{% static 'public/assets/fonts/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'public/assets/fonts/themify-icons.css' %}">
    <link rel="stylesheet" href="{% static 'public/assets/owlcarousel/css/owl.carousel.css' %}">
    <link rel="stylesheet" href="{% static 'public/assets/owlcarousel/css/owl.theme.css' %}">     
    <link rel="stylesheet" href="{% static 'public/assets/css/animate.css' %}">                    
    <link rel="stylesheet" href="{% static 'public/assets/css/magnific-popup.css' %}">                 
    <link rel="stylesheet" href="{% static 'public/assets/css/menu.css' %}">           
    <link rel="stylesheet" href="{% static 'public/assets/css/style.css' %}">          
    <link rel="stylesheet" href="{% static 'public/assets/css/responsive.css' %}">         

    <style>
        .custom-home-bg { background-image: url("{% static 'imagenes/hola1.jpeg' %}"); background-size: cover; background-position: center center; }
        .custom-skills-bg { background-image: url("{% static 'public/assets/img/bg/skill-bg.jpg' %}"); background-size: cover; background-position: center; }
        .custom-video-bg { background-image: url("{% static 'public/assets/img/bg/video-bg.jpg' %}"); background-size: cover; background-position: center center; }
        .custom-footer-bg { background-image: url("{% static 'public/assets/img/bg/footer.png' %}"); background-size: cover; }
        
        .preloader { animation: automaticClose 5s forwards; }
        @keyframes automaticClose {
            90% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; display: none; }
        }
    </style>
</head>
<body data-spy="scroll" data-offset="80">

    <div class="preloader">
        <div class="spinner">
            <div class="double-bounce1"></div>
            <div class="double-bounce2"></div>
        </div>
    </div>

    {% include 'header.html' %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'footer.html' %}

    <script src="{% static 'public/assets/js/jquery-1.12.4.min.js' %}"></script>
    <script src="{% static 'public/assets/js/popper.min.js' %}"></script>
    <script src="{% static 'public/assets/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'public/assets/js/owl.carousel.min.js' %}"></script>
    <script src="{% static 'public/assets/js/wow.min.js' %}"></script>
    <script src="{% static 'public/assets/js/jquery.magnific-popup.min.js' %}"></script>
    <script src="{% static 'public/assets/js/main.js' %}"></script>

    <script>
        $(document).ready(function() {
            $('.preloader').fadeOut('slow');
        });
    </script>
</body>
</html>
