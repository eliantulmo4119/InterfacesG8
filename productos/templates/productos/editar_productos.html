{% include "private/header.html" %}

<div class="container mt-4">
    <h2>Editar Producto</h2>

    <form method="post">
        {% csrf_token %}

        <!-- Nombre -->
        <div class="mb-3">
            <label>Nombre Producto</label>
            <input type="text"
                   name="nombreProducto"
                   class="form-control"
                   value="{{ producto.nombre_producto }}"
                   required>
        </div>

        <!-- Precio -->
        <div class="mb-3">
            <label>Precio Producto</label>
            <input type="number"
                   step="0.01"
                   name="precioProducto"
                   class="form-control"
                   value="{{ producto.precio_producto }}"
                   required>
        </div>

        <!-- Stock -->
        <div class="mb-3">
            <label>Stock Producto</label>
            <input type="number"
                   name="stockProducto"
                   class="form-control"
                   value="{{ producto.stock_producto }}"
                   required>
        </div>

        <!-- Estado -->
        <div class="mb-3">
            <label>Estado Producto</label>
            <select name="estadoProducto" class="form-control" required>
                <option value="Activo"
                    {% if producto.estado_producto == "Activo" %}selected{% endif %}>
                    Activo
                </option>

                <option value="Inactivo"
                    {% if producto.estado_producto == "Inactivo" %}selected{% endif %}>
                    Inactivo
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar cambios
        </button>

        <a href="{% url 'listar_productos' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>
</div>

{% include "private/footer.html" %}
