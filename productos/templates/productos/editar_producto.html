{% load static %}
{% include "private/header.html" %}

<link class="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<div class="main-panel" style="background: #1a1a24; min-height: 100vh;">
  <div class="content-wrapper">

    <div class="row justify-content-center">
      <div class="col-md-8 grid-margin stretch-card">
        <div class="card bg-dark border-secondary text-white">
          <div class="card-body">

            <h4 class="card-title text-warning font-weight-bold"><i class="mdi mdi-package-variant mr-2"></i>Modificar Producto</h4>
            <p class="text-muted mb-2">Actualizando ID: #{{ producto.id }} - {{ producto.nombre }}</p>
            <hr class="border-secondary">

            <form method="POST" id="formEditarProducto">
              {% csrf_token %}

              <div class="form-group mb-2">
                <label class="text-muted small">Nombre del Producto</label>
                <input type="text" class="form-control bg-secondary text-white border-0" name="nombre" value="{{ producto.nombre }}" required>
              </div>

              <div class="form-group mb-2">
                <label class="text-muted small">Descripción</label>
                <textarea class="form-control bg-secondary text-white border-0" name="descripcion" rows="2">{{ producto.descripcion|default:'' }}</textarea>
              </div>

              <div class="form-group mb-2">
                <label class="text-muted small">Precio de Compra</label>
                <input type="number" step="0.01" class="form-control bg-secondary text-white border-0" name="precio_compra" value="{{ producto.precio_compra }}" required>
              </div>

              <div class="form-group mb-2">
                <label class="text-muted small">Precio de Venta</label>
                <input type="number" step="0.01" class="form-control bg-secondary text-white border-0" name="precio_venta" value="{{ producto.precio_venta }}" required>
              </div>

              <div class="form-group mb-2">
                <label class="text-muted small">Stock Actual</label>
                <input type="number" class="form-control bg-secondary text-white border-0" name="stock" value="{{ producto.stock }}" required>
              </div>

              <div class="form-group mb-3">
                <label class="text-muted small">Stock Mínimo</label>
                <input type="number" class="form-control bg-secondary text-white border-0" name="stock_minimo" value="{{ producto.stock_minimo }}" required>
              </div>

              <div class="form-group mb-3">
                <label class="text-muted small">Proveedor Asignado</label>
                <select class="form-control bg-secondary text-white border-0" name="id_proveedor">
                  <option value="">Seleccione Proveedor</option>
                  {% for p in proveedores %}
                    <option value="{{ p.id }}" {% if p.id == producto.proveedor.id %}selected{% endif %}>{{ p.nombre_empresa }}</option>
                  {% endfor %}
                </select>
              </div>

              <button type="submit" class="btn btn-info text-white">Actualizar</button>
              <a href="{% url 'listar_productos' %}" class="btn btn-danger">Cancelar</a>

            </form>

          </div>
        </div>
      </div>
    </div>

  </div>

  {% include "private/footer.html" %}
</div>

<script>
document.getElementById("formEditarProducto").addEventListener("submit", function(e){
  e.preventDefault();

  Swal.fire({
    title: "¿Actualizar datos del producto?",
    icon: "warning",
    showCancelButton: true,
    confirmButtonText: "Sí",
  }).then((r)=>{
    if(r.isConfirmed){
      this.submit();
    }
  });
});
</script>
