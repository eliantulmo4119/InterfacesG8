{% extends 'base.html' %}
{% load static %}

{% block title %}Iniciar Sesión - Vulcanizadora Elian{% endblock %}

{% block content %}
<style>
    /* Estilos premium específicos para el Login */
    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        /* Se ajusta el min-height y se añade padding-top para compensar la barra fija del menú */
        min-height: 100vh; 
        padding: 110px 20px 60px 20px; /* 110px arriba evita que el menú tape la tarjeta */
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        box-sizing: border-box;
    }

    .login-container {
        background-color: #ffffff;
        padding: 40px 35px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 420px;
        box-sizing: border-box;
    }

    .login-container h2 {
        margin-top: 0;
        margin-bottom: 8px;
        color: #212529;
        text-align: center;
        font-size: 26px;
        font-weight: 700;
    }

    .login-subtitle {
        text-align: center;
        color: #6c757d;
        font-size: 14px;
        margin-bottom: 32px;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #495057;
        font-size: 14px;
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #dee2e6;
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 15px;
        color: #212529;
        background-color: #f8f9fa;
        transition: all 0.2s ease-in-out;
    }

    .form-group input:focus {
        border-color: #0d6efd; 
        background-color: #ffffff;
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        outline: none;
    }

    .btn-custom {
        width: 100%;
        padding: 13px;
        background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        font-weight: 600;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 12px rgba(13, 110, 253, 0.2);
        transition: all 0.25s ease;
        margin-top: 10px;
    }

    .btn-custom:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(13, 110, 253, 0.3);
    }

    .btn-custom:active {
        transform: translateY(0);
    }

    .forgot-password {
        display: block;
        text-align: right;
        font-size: 13px;
        color: #0d6efd;
        text-decoration: none;
        margin-top: -12px;
        margin-bottom: 24px;
        font-weight: 500;
    }

    .forgot-password:hover {
        text-decoration: underline;
        color: #0a58ca;
    }
</style>

<div class="login-wrapper">
    <div class="login-container wow fadeIn" data-wow-duration="0.8s">
        <h2>Sistema Inventario</h2>
        <p class="login-subtitle">Inicie sesión para gestionar la vulcanizadora</p>
        
        <form action="#" method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuario o Correo</label>
                <input type="text" id="username" name="username" placeholder="Ej: admin_elian" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="btn-custom">Ingresar al Sistema</button>
        </form>
    </div>
</div>
{% endblock %}
